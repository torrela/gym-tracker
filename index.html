<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Gym y Pasos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14110d">
<style>
:root{--bg:#14110d;--card:#1d1913;--tx:#f4ecdc;--mu:#a39a88;--ac:#d9981f;--bd:#3d3527;--ln:#3a3328;--sf:#2c261b;--hi:#f4ecdc;color-scheme:dark}
:root[data-theme="light"]{--bg:#f2e9d8;--card:#fffdf8;--tx:#161412;--mu:#6f675a;--ac:#c4841a;--bd:#161412;--ln:#d8cdb6;--sf:#e9dfca;--hi:#161412;color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{background:var(--card)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.page{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.in{max-width:640px;margin:0 auto;padding:18px 16px 24px}
button{font:inherit;color:var(--tx);cursor:pointer}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font:italic 17px/1.3 Georgia,"Times New Roman",serif;color:var(--mu);margin:4px 0 6px}
h2{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 span{font-weight:500;color:var(--mu);font-size:14px}
h1+.card{margin-top:14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ib{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;font-size:24px;line-height:1}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
button.card{display:block;width:100%;text-align:left}
.rt b{display:block;font-size:18px;letter-spacing:-.02em}
.rt span,.cur span{display:block;font-size:14px;color:var(--mu)}
.free{text-align:center!important;border-style:dashed!important;font-weight:600;background:transparent!important;padding:16px}
.cur{background:var(--ac)!important;border-color:var(--ac)!important}
.cur b,.cur span{color:#fff!important}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.strip div{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:8px 0;line-height:1.2;font-size:12px;color:var(--mu);font-weight:600;text-align:center}
.strip i{display:block;font-style:normal;font-size:19px;font-weight:800;color:var(--tx)}
.strip .f{background:var(--ac);border-color:var(--ac);color:#fff}
.strip .f i{color:#fff}
.strip .on{border:2.5px solid var(--hi);padding:6.5px 0}
input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
.nm{font-size:20px;font-weight:800;letter-spacing:-.02em;border-color:transparent;background:transparent;padding:4px 0}
.nm:focus{background:var(--bg);padding:4px 10px}
.steps{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.sf{flex:1;min-width:180px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sf label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.empty{color:var(--mu);font-size:14px;padding:6px 0}
.chip{font-size:13px;background:var(--sf);border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.d{display:block;font-size:14px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row small{display:block;color:var(--mu);font-size:13px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh>div{flex:1;min-width:0}.sh b{font-size:20px;letter-spacing:-.02em;display:block}
.sh small{display:block;color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}
.fin{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:0 16px;height:42px;font-weight:700}
.st{display:grid;grid-template-columns:24px minmax(0,1fr) 14px minmax(0,1fr) 30px;gap:8px;align-items:center;margin-top:8px}
.st .sn,.st b{color:var(--mu);font-weight:700;text-align:center}
.st input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac);margin:0}
.st.ok input[type=number]{border-color:var(--ac)}
.sa{display:flex;gap:8px;margin-top:10px}
.sa button{flex:1;background:var(--sf);border:0;border-radius:10px;padding:9px;font-weight:600}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:1.5px dashed var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.add input:first-child{grid-column:1/-1}
.add button{background:var(--hi);color:var(--bg);border:0;border-radius:10px;padding:0 18px;font-weight:700;min-height:44px}
.dng{background:none;border:0;color:var(--mu);text-decoration:underline;font-size:14px;padding:12px;width:100%}
.er{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) auto;gap:6px;margin-top:8px}
.er button{background:none;border:0;color:var(--mu);font-size:16px;padding:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal span{text-align:center;font-size:12px;color:var(--mu);font-weight:600}
.cal button{aspect-ratio:1;background:var(--card);border:1.5px solid var(--ln);border-radius:10px;font-weight:700;padding:0}
.cal .o{opacity:.35}.cal .f{background:var(--ac);border-color:var(--ac);color:#fff}.cal .on{border:2.5px solid var(--hi)}
.wk{display:flex;gap:8px;margin:12px 0 4px}
.wk button{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;height:42px;padding:0 16px;font-weight:700}
.wk button:nth-child(2){flex:1}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sum div{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px}
.sum b{display:block;font-size:22px;line-height:1.2}
.sum span{font-size:13px;color:var(--mu)}
.bar{height:10px;background:var(--sf);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tb{flex:none;background:var(--card);border-top:1.5px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tb div{display:flex;max-width:640px;margin:0 auto}
.tb button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);padding:4px 0}
.tb button.on{color:var(--ac)}
.tb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main id="app"></main>
<script>
const K="gymtracker.v1",D=["L","M","X","J","V"];
const u=()=>Math.random().toString(36).slice(2,8),pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),dt=k=>new Date(k+"T12:00");
const mo=x=>x.toLocaleDateString("es-ES",{day:"numeric",month:"short"}),fmt=n=>Math.round(n).toLocaleString("es-ES");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
const monday=d=>{d=new Date(d);d.setHours(12,0,0,0);return addD(d,-((d.getDay()+6)%7))};
const E=(id,n,d)=>({id,name:n,detail:d||""});
function routineV2(){return{names:["Vertical output","Hipertrofia + pull","Descanso","Fuerza + potencia horizontal","Descanso","Activación muscular + prehab","Descanso"],
routine:{
0:[E("l1","Leg Extension Isometric","2 x 30 seg · RIR 4 · descanso 60 s"),E("l2","Single Leg Wall Sit","2 x 30 seg cada pierna · suave · descanso 60 s"),E("l3","1/2 Kneeling Hamstring Slide","2 x 6 controlado · descanso 60 s"),E("l4","Box Jump to Single Leg Lands","3 x 3 cada pierna · calidad, para si baja la altura · descanso 90 s"),E("l5","Farmers Carry (HEAVY)","2 x 20 pasos · pesado pero técnico, RIR 3 · descanso 90 s"),E("l6","Trap Bar Deadlift","3 x 3 + calentamiento · RIR 3-4, velocidad alta · descanso 2-3 min"),E("l7","Weighted Chin Ups","3 x 4 · RIR 3 · descanso 2 min"),E("l8","DB Step Up","2 x 5 cada pierna · carga moderada · descanso 60-90 s")],
1:[E("m1","Knee CAR’s","5 reps cada dirección"),E("m2","World Greatest Stretch","4 reps"),E("m3","Shoulder Swimmers","6 reps lentas"),E("m4","Wall Openbook","2 x 8 cada lado"),E("m5","Inverted Row","3 x 8-12 · RIR 2 · descanso 90 s"),E("m6","Fit Ball Leg Curl","2 x 8-10 cada pierna · RIR 3 · descanso 60 s"),E("m7","Single Leg Hip Thrust Hold","2 x 30 seg cada pierna · descanso 45 s"),E("m8","Rope Face Pull","3 x 12-15 · RIR 2 · descanso 60 s"),E("m9","Bicep Curl","3 x 10 cada brazo · RIR 2 · descanso 60 s")],
2:[],
3:[E("j1","Wall Openbook","2 x 8"),E("j2","1/2 Kneeling Hamstring Slide","2 x 6 controlado · descanso 60 s"),E("j3","Quadruped Shoulder Tap","2 x 20"),E("j4","Glute Bridge","2 x 5 (3-5 babysteps)"),E("j5","Bench Press","3 x 5 + calentamiento · RIR 2-3 · descanso 2-3 min"),E("j6","Romanian Deadlift","2 x 5 + calentamiento · RIR 3-4, sin llegar al límite · descanso 2-3 min"),E("j7","Hip Thrust","2 x 6 · RIR 3 · descanso 90 s")],
4:[],
5:[E("s1","Neck CAR’s"),E("s2","Thoracic Spine CAR’s"),E("s3","Cat Camel"),E("s4","Groin Rockers"),E("s5","90-90 Hip Turns"),E("s6","Plank Toe Touches"),E("s7","World Greatest Stretch"),E("s8","Forward and Side Leg Swings"),E("s9","Goblet Cossack Squat","2 x 5 cada pierna"),E("s10","Wall Angel","2 x 10"),E("s11","Copenhagen Plank","2 x 20 seg cada lado"),E("s12","Scap Row","2 x 10"),E("s13","Landmine Side Squat","2 x 8 cada pierna · ligero")],
6:[]}}}

function mig(o){const rs=[],ss=[],st={};
for(let i=0;i<7;i++){const a=(o.routine||{})[i]||[];if(a.length)rs.push({id:"r"+i,name:(o.names||[])[i]||"Rutina "+(i+1),ex:a.map(e=>({id:e.id,name:e.name,detail:e.detail||""}))})}
for(const k in o.logs||{}){const l=o.logs[k],i=(dt(k).getDay()+6)%7,r=rs.find(x=>x.id==="r"+i);if(+l.steps)st[k]=+l.steps;
if(!r)continue;const ex={},list=[];r.ex.forEach(e=>{const g=l.ex&&l.ex[e.id];if(g&&(g.d||+g.w>0)){list.push(e);ex[e.id]={sets:[{w:g.w==null?"":String(g.w),r:"",d:true}]}}});
if(list.length)ss.push({id:u(),date:k,rid:r.id,name:r.name,dur:0,list,ex})}
return{v:4,goal:o.goal||10000,theme:"dark",routines:rs,sessions:ss,steps:st,cur:null}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S=mig(Object.assign({goal:10000,logs:{}},routineV2()));else if(!S.routines)S=mig(S);
document.documentElement.dataset.theme=S.theme||"dark";
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V="reg",wo=0,cm=new Date(),cd=iso(new Date()),A="";cm=new Date(cm.getFullYear(),cm.getMonth(),1);
let TOP=false;const setV=v=>{V=v;A="";TOP=true;R()};
const theme=()=>{S.theme=S.theme==="light"?"dark":"light";document.documentElement.dataset.theme=S.theme;save()};
const ask=k=>{if(A===k){A="";return true}A=k;R();return false};
const setSteps=v=>{S.steps[iso(new Date())]=+v||0;save();R()};
const setGoal=v=>{S.goal=Math.max(1,+v||10000);save();R()};
const mv=n=>{cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);R()},mvT=()=>{const t=new Date();cm=new Date(t.getFullYear(),t.getMonth(),1);cd=iso(t);R()},pickD=k=>{cd=k;R()};
const nw=n=>{wo+=n;R()},nw0=()=>{wo=0;R()};
const vol=s=>{let t=0;Object.values(s.ex).forEach(e=>e.sets.forEach(x=>{if(x.d)t+=(+x.w||0)*(+x.r||0)}));return t};
const bySes=()=>[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
const topW=x=>Math.max(0,...x.sets.filter(t=>t.d||+t.w>0).map(t=>+t.w||0));
function hist(n){const h=[];bySes().forEach(s=>s.list.forEach(e=>{if(e.name===n&&s.ex[e.id]){const w=topW(s.ex[e.id]);if(w>0)h.push({d:s.date,w})}}));return h}
function lastOf(n,id){for(const s of bySes().reverse()){if(s.id===id)continue;for(const e of s.list)if(e.name===n&&s.ex[e.id]&&s.ex[e.id].sets.some(t=>+t.w>0))return s.ex[e.id].sets}return null}
const nSets=d=>{const m=/^(\d+)\s*x/.exec(d||"");return m?Math.min(+m[1],6):1};
const mk=e=>({sets:Array.from({length:nSets(e.detail)},()=>({w:"",r:"",d:false}))});
function start(rid){if(S.cur){setV("ses");return}const r=S.routines.find(x=>x.id===rid),list=r?r.ex.map(e=>({...e})):[],ex={};list.forEach(e=>ex[e.id]=mk(e));
S.cur={id:u(),date:iso(new Date()),rid,name:r?r.name:"Sesión libre",start:Date.now(),list,ex};save();setV("ses")}
function openSes(id){if(!S.cur){const s=S.sessions.find(x=>x.id===id);if(!s)return;S.cur=JSON.parse(JSON.stringify(s));S.cur.ed=true;save()}setV("ses")}
const ss=(id,i,f,v)=>{S.cur.ex[id].sets[i][f]=v;save()};
const addSet=id=>{S.cur.ex[id].sets.push({w:"",r:"",d:false});save();R()};
const delSet=id=>{const a=S.cur.ex[id].sets;if(a.length>1)a.pop();save();R()};
function addSEx(){const n=document.getElementById("sn").value.trim();if(!n)return;const e={id:u(),name:n,detail:document.getElementById("sd").value.trim()};S.cur.list.push(e);S.cur.ex[e.id]=mk(e);save();R()}
function finish(){const c=S.cur;if(!Object.values(c.ex).some(e=>e.sets.some(s=>s.d))){if(!ask("fin"))return;S.cur=null;save();setV("reg");return}
const s={id:c.id,date:c.date,rid:c.rid,name:c.name,dur:c.ed?c.dur:Math.max(1,Math.round((Date.now()-c.start)/60000)),list:c.list,ex:c.ex},i=S.sessions.findIndex(x=>x.id===s.id);
if(i>=0)S.sessions[i]=s;else S.sessions.push(s);S.cur=null;save();setV("reg")}
function discard(){if(!ask("dis"))return;if(S.cur.ed)S.sessions=S.sessions.filter(x=>x.id!==S.cur.id);S.cur=null;save();setV("reg")}
const rn=(id,v)=>{S.routines.find(r=>r.id===id).name=v;save()};
const ee=(r,e,f,v)=>{S.routines.find(x=>x.id===r).ex.find(x=>x.id===e)[f]=v;save()};
function addEx(r){const n=document.getElementById("an_"+r).value.trim();if(!n)return;S.routines.find(x=>x.id===r).ex.push({id:u(),name:n,detail:document.getElementById("ad_"+r).value.trim()});save();R()}
function delEx(r,e){if(!ask("d"+e))return;const x=S.routines.find(y=>y.id===r);x.ex=x.ex.filter(y=>y.id!==e);save();R()}
const addR=()=>{S.routines.push({id:u(),name:"Nueva rutina",ex:[]});save();R()};
function delR(r){if(!ask("r"+r))return;S.routines=S.routines.filter(x=>x.id!==r);save();R()}
const tm=()=>{const c=S.cur;if(!c)return"";if(c.ed)return c.dur+" min";const s=Math.max(0,Math.floor((Date.now()-c.start)/1000));return pad(Math.floor(s/60))+":"+pad(s%60)};
setInterval(()=>{const t=document.getElementById("tm");if(t&&S.cur)t.textContent=tm()},1000);
function spark(a){if(a.length<2)return"";const W=300,H=44,mn=Math.min(...a.map(x=>x.w)),mx=Math.max(...a.map(x=>x.w)),r=mx-mn||1;
const p=a.map((x,i)=>(i/(a.length-1)*W).toFixed(1)+","+(H-4-(x.w-mn)/r*(H-8)).toFixed(1)).join(" ");
return`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="margin-top:8px"><polyline points="${p}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
function sesRow(s){const n=s.list.filter(e=>s.ex[e.id]&&s.ex[e.id].sets.some(x=>x.d)).length,v=vol(s);
return`<button class="card row" onclick="openSes('${s.id}')"><div><b>${esc(s.name)}</b><small>${mo(dt(s.date))} · ${n} ejercicios${s.dur?" · "+s.dur+" min":""}</small></div><span class="chip">${v?fmt(v)+" kg":"Registrada"}</span></button>`}
const SUN='<svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function regV(){const td=iso(new Date()),w0=monday(new Date()),wk=[...Array(5)].map((_,i)=>iso(addD(w0,i))),w7=iso(addD(w0,6)),inW=S.sessions.filter(s=>s.date>=wk[0]&&s.date<=w7);
const st=+S.steps[td]||0,pc=Math.min(1,st/S.goal),C=2*Math.PI*34;
const last=S.sessions.map((s,i)=>[s,i]).sort((a,b)=>b[0].date.localeCompare(a[0].date)||b[1]-a[1]).slice(0,5).map(x=>sesRow(x[0])).join("");
return`<div class="hd"><h1>Registrar</h1><button class="ib" onclick="theme()" aria-label="Cambiar tema">${SUN}</button></div>
${S.cur?`<button class="card cur" onclick="setV('ses')"><b>Sesión en curso: ${esc(S.cur.name)}</b><span>Toca para continuar</span></button>`:""}
<h2>Elige una rutina</h2>
${S.routines.map(r=>`<button class="card rt" onclick="start('${r.id}')"><b>${esc(r.name)}</b><span>${esc(r.ex.slice(0,4).map(e=>e.name).join(" · ")||"Sin ejercicios")}</span></button>`).join("")}
<button class="card free" onclick="start('')">+ Sesión libre</button>
<h2>Esta semana <span>${inW.length} de ${S.routines.length} entrenos</span></h2>
<div class="strip">${wk.map((k,i)=>`<div class="${inW.some(s=>s.date===k)?"f":""} ${k===td?"on":""}">${D[i]}<i>${dt(k).getDate()}</i></div>`).join("")}</div>
<h2>Pasos de hoy <span>${fmt(st)} de ${fmt(S.goal)}</span></h2>
<div class="card"><div class="steps"><div class="ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="34" fill="none" stroke="var(--sf)" stroke-width="9"/><circle cx="44" cy="44" r="34" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(pc*C).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${Math.round(pc*100)}%</b></div>
<div class="sf"><div><label>Pasos</label><input type="number" inputmode="numeric" min="0" value="${st||""}" placeholder="0" onchange="setSteps(this.value)"></div><div><label>Meta</label><input type="number" inputmode="numeric" value="${S.goal}" onchange="setGoal(this.value)"></div></div></div></div>
<h2>Últimas sesiones</h2>${last||'<div class="empty">Aún no hay sesiones. Elige una rutina para empezar.</div>'}`}
function sesV(){const c=S.cur;
return`<div class="sh"><button class="ib" onclick="setV('reg')" aria-label="Volver">‹</button><div><b>${esc(c.name)}</b><small id="tm">${tm()}</small></div><button class="fin" onclick="finish()">${A==="fin"?"¿Descartar?":"Terminar"}</button></div>
${c.list.map(e=>{const x=c.ex[e.id],ls=lastOf(e.name,c.id),b=ls&&ls.filter(t=>+t.w>0).sort((p,q)=>q.w-p.w)[0];
return`<div class="card"><b>${esc(e.name)}</b>${e.detail?`<span class="d">${esc(e.detail)}</span>`:""}${b?`<span class="chip" style="margin-top:6px">Última vez: ${b.w} kg${+b.r?" × "+b.r:""}</span>`:""}
${x.sets.map((s,i)=>`<div class="st${s.d?" ok":""}"><span class="sn">${i+1}</span><input type="number" inputmode="decimal" step="0.5" min="0" value="${s.w}" placeholder="${ls&&ls[i]&&+ls[i].w||"kg"}" onchange="ss('${e.id}',${i},'w',this.value)" aria-label="Peso serie ${i+1}"><b>×</b><input type="number" inputmode="numeric" min="0" value="${s.r}" placeholder="${ls&&ls[i]&&+ls[i].r||"reps"}" onchange="ss('${e.id}',${i},'r',this.value)" aria-label="Repeticiones serie ${i+1}"><input type="checkbox" ${s.d?"checked":""} onchange="ss('${e.id}',${i},'d',this.checked);this.closest('.st').classList.toggle('ok',this.checked)" aria-label="Serie hecha"></div>`).join("")}
<div class="sa"><button onclick="addSet('${e.id}')">+ Serie</button>${x.sets.length>1?`<button onclick="delSet('${e.id}')">− Serie</button>`:""}</div></div>`}).join("")}
<div class="add"><input type="text" id="sn" placeholder="+ Añadir ejercicio a la sesión"><input type="text" id="sd" placeholder="Ej. 3 x 8"><button onclick="addSEx()">Añadir</button></div>
<button class="dng" onclick="discard()">${A==="dis"?"¿Seguro? Toca otra vez":c.ed?"Eliminar sesión":"Descartar sesión"}</button>`}
function rutV(){return`<h1>Rutinas</h1>`+S.routines.map(r=>`<div class="card"><input class="nm" type="text" value="${esc(r.name)}" onchange="rn('${r.id}',this.value)" aria-label="Nombre de la rutina">
${r.ex.map(e=>`<div class="er"><input type="text" value="${esc(e.name)}" onchange="ee('${r.id}','${e.id}','name',this.value)" aria-label="Ejercicio"><input type="text" value="${esc(e.detail||"")}" placeholder="3 x 8" onchange="ee('${r.id}','${e.id}','detail',this.value)" aria-label="Series y repeticiones"><button onclick="delEx('${r.id}','${e.id}')" aria-label="Quitar">${A==="d"+e.id?"¿Seguro?":"✕"}</button></div>`).join("")}
<div class="add" style="margin-top:12px"><input type="text" id="an_${r.id}" placeholder="+ Nuevo ejercicio"><input type="text" id="ad_${r.id}" placeholder="Ej. 3 x 8"><button onclick="addEx('${r.id}')">Añadir</button></div>
<button class="dng" onclick="delR('${r.id}')">${A==="r"+r.id?"¿Seguro? Toca otra vez":"Eliminar rutina"}</button></div>`).join("")+`<button class="card free" onclick="addR()">+ Nueva rutina</button>`}
function progV(){const ns=[...new Set(S.sessions.flatMap(s=>s.list.map(e=>e.name)))].map(n=>({n,h:hist(n)})).filter(x=>x.h.length).sort((a,b)=>b.h[b.h.length-1].d.localeCompare(a.h[a.h.length-1].d));
return`<h1>Progreso</h1><h2>Ejercicios <span>${ns.length} con registros</span></h2>`+(ns.length?ns.map(({n,h})=>`<div class="card"><div class="row"><b>${esc(n)}</b><span class="chip">Mejor ${Math.max(...h.map(x=>x.w))} kg</span></div>${spark(h)}<div class="chips">${h.slice(-5).map(x=>`<span class="chip">${mo(dt(x.d))} · ${x.w} kg</span>`).join("")}</div></div>`).join(""):'<div class="empty">Aún no hay pesos registrados. Termina una sesión con series marcadas y aquí verás cómo evolucionan.</div>')}
function calV(){const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7,s0=addD(new Date(y,m,1,12),-off);
const cells=[...Array(n)].map((_,i)=>{const d=addD(s0,i),k=iso(d);return`<button class="${d.getMonth()!==m?"o":""} ${S.sessions.some(s=>s.date===k)?"f":""} ${k===cd?"on":""}" onclick="pickD('${k}')">${d.getDate()}</button>`}).join("");
const sp=+S.steps[cd]||0;
return`<h1>Calendario</h1><div class="wk"><button onclick="mv(-1)" aria-label="Mes anterior">‹</button><button style="text-transform:capitalize" onclick="mvT()">${cm.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</button><button onclick="mv(1)" aria-label="Mes siguiente">›</button></div>
<div class="cal" style="margin-top:12px">${["L","M","X","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}${cells}</div>
<h2>${dt(cd).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}<span>${sp?fmt(sp)+" pasos":""}</span></h2>${S.sessions.filter(s=>s.date===cd).map(sesRow).join("")||'<div class="empty">Sin sesiones este día.</div>'}`}
function resV(){const w=addD(monday(new Date()),7*wo),a=iso(w),b=iso(addD(w,6)),ss=S.sessions.filter(s=>s.date>=a&&s.date<=b),tv=ss.reduce((t,s)=>t+vol(s),0),tt=ss.reduce((t,s)=>t+(s.dur||0),0);
let sp=0,sd=0,gd=0;for(let i=0;i<7;i++){const x=+S.steps[iso(addD(w,i))]||0;sp+=x;if(x)sd++;if(x>=S.goal)gd++}
const mx=Math.max(1,...ss.map(vol));
return`<h1>Resumen</h1>
<div class="wk"><button onclick="nw(-1)" aria-label="Semana anterior">‹</button><button onclick="nw0()">Esta semana</button><button onclick="nw(1)" aria-label="Semana siguiente">›</button></div>
<h2>Semana <span>${mo(w)} – ${mo(addD(w,6))}</span></h2><div class="sum"><div><b>${ss.length}/${S.routines.length}</b><span>Entrenos</span></div><div><b>${fmt(tv)} kg</b><span>Volumen total</span></div><div><b>${tt} min</b><span>Tiempo entrenando</span></div><div><b>${fmt(sp)}</b><span>Pasos totales</span></div><div><b>${fmt(sd?sp/sd:0)}</b><span>Media diaria</span></div><div><b>${gd}/7</b><span>Días con meta</span></div></div>
<h2>Volumen por sesión</h2>`+(ss.length?ss.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="chip">${fmt(vol(s))} kg</span></div><small class="d">${mo(dt(s.date))}</small><div class="bar"><i style="width:${vol(s)/mx*100}%"></i></div></div>`).join(""):'<div class="empty">Sin sesiones esta semana.</div>')}
const IC={reg:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',rut:'<path d="M4 6h16M4 12h16M4 18h10"/>',prog:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',res:'<path d="M5 20V10M12 20V4M19 20v-7"/>'};
const TB=[["reg","Registrar"],["rut","Rutinas"],["prog","Progreso"],["cal","Calendario"],["res","Resumen"]];
function R(){const v=V==="ses"&&S.cur?sesV():V==="rut"?rutV():V==="prog"?progV():V==="cal"?calV():V==="res"?resV():(V="reg",regV());
const o=document.getElementById("pg"),y=o?o.scrollTop:0;document.getElementById("app").innerHTML=`<div class="page" id="pg"><div class="in">${v}</div></div><nav class="tb"><div>${TB.map(t=>`<button class="${V===t[0]||(V==="ses"&&t[0]==="reg")?"on":""}" onclick="setV('${t[0]}')"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("")}</div></nav>`;document.getElementById("pg").scrollTop=TOP?0:y;TOP=false}
save();R();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
